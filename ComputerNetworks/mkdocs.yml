site_name: Computer Networks Notes
site_url: https://tensofermi.github.io/notes/ComputerNetworks/

theme:
  name: material
  language: 'zh'
  font: false
  logo: logo/network.svg
  favicon: logo/network.svg
  palette:
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  features:
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

plugins:
  - search:
      lang:
        - zh
        - en
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: none
      width: 100%
      height: auto
      zoomable: true
      draggable: false
      auto_caption: false
      caption_position: bottom

hooks:
  - ../mkdocs_file_search.py

extra_javascript:
  - javascripts/mathjax.js
  - https://tensofermi.github.io/notes/_shared/mathjax/es5/tex-chtml.js

extra:
  social:
    - icon: octicons/home-fill-24
      link: https://tensofermi.github.io/

use_directory_urls: false

nav:
  - "概述": index.md
  - "第 1 章 一个请求怎样穿过网络":
    - "章节概览": chapter_01_foundations/index.md
    - "分层、封装与协议": chapter_01_foundations/01_layering_and_encapsulation.md
    - "分组交换与网络性能": chapter_01_foundations/02_packet_switching_and_performance.md
  - "第 2 章 应用层、命名与 Socket":
    - "章节概览": chapter_02_application/index.md
    - "HTTP 与 HTTPS": chapter_02_application/01_http_https.md
    - "DNS": chapter_02_application/02_dns.md
    - "从服务名到监听中的进程": chapter_02_application/04_socket_and_listening.md
    - "邮件、Socket 与 CDN（选读）": chapter_02_application/03_email_socket_cdn.md
  - "第 3 章 从不可靠信道到可靠传输":
    - "章节概览": chapter_03_transport/index.md
    - "UDP 与 TCP": chapter_03_transport/01_udp_tcp.md
    - "可靠传输": chapter_03_transport/02_reliable_transport.md
  - "第 4 章 TCP、流量控制与拥塞控制":
    - "流量控制与拥塞控制": chapter_03_transport/03_flow_congestion_control.md
  - "第 5 章 IP、子网、转发与路由":
    - "章节概览": chapter_04_network/index.md
    - "IPv4、子网与地址规划": chapter_04_network/01_ip_addressing_subnetting.md
    - "IPv6、NAT 与 ICMP": chapter_04_network/02_ipv6_nat_icmp.md
    - "转发与路由": chapter_04_network/03_forwarding_routing.md
  - "第 6 章 链路层与局域网":
    - "章节概览": chapter_05_link/index.md
    - "差错检测与介质访问": chapter_05_link/01_error_detection_mac.md
    - "以太网、Wi‑Fi 与 ARP": chapter_05_link/02_ethernet_wifi_arp.md
  - "第 7 章 TLS、身份与远程访问":
    - "章节概览": chapter_06_security/index.md
    - "TLS 与可信连接": chapter_06_security/01_tls.md
    - "基本威胁与分层防御": chapter_06_security/02_threats_defenses.md
    - "HTTPS、SSH 与 VPN": chapter_06_security/03_remote_access_identity.md
  - "第 8 章 虚拟网络、隧道与容器联网":
    - "章节概览": chapter_09_virtual_network/index.md
    - "从虚拟网卡到隧道": chapter_09_virtual_network/01_interfaces_bridges_tunnels.md
  - "第 9 章 服务发现、代理与负载均衡":
    - "服务发现、代理与负载均衡": chapter_09_virtual_network/02_service_discovery_proxies.md
  - "第 10 章 数据中心互连与多机通信": chapter_10_data_center/index.md
  - "第 11 章 综合练习：追踪请求和故障":
    - "综合案例概览": chapter_07_case_study/index.md
    - "从 URL 到页面": chapter_07_case_study/01_url_to_page.md
    - "从远程请求到 Agent 沙箱": chapter_07_case_study/02_agent_workstation.md
    - "诊断概览": chapter_08_diagnostics/index.md
    - "诊断工具与排障路径": chapter_08_diagnostics/01_diagnostic_tools.md
    - "自测题与答案": chapter_08_diagnostics/02_review_self_test.md
  - "参考资料": references.md
