    - "信息熵、交叉熵与 KL 散度": prerequisites/entropy_cross_entropy_kl.md
    - "最大似然与前向 KL": prerequisites/mle_forward_kl.md
    - "推断、统计推断与信念传播": prerequisites/inference_belief_propagation.md
