site_name: Operating Systems Notes
site_url: https://tensofermi.github.io/notes/OperatingSystems/

theme:
  name: material
  language: 'zh'
  font: false
  logo: logo/os.svg
  favicon: logo/main.png
  palette:
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  features:
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search:
      lang:
        - zh
        - en
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: none
      width: 100%
      height: auto
      zoomable: true
      draggable: false
      auto_caption: false
      caption_position: bottom

hooks:
  - ../mkdocs_file_search.py

extra_javascript:
  - javascripts/mathjax.js
  - https://tensofermi.github.io/notes/_shared/mathjax/es5/tex-chtml.js

extra:
  social:
    - icon: octicons/home-fill-24
      link: https://tensofermi.github.io/

use_directory_urls: false

nav:
  - "概述": index.md
  - "第 1 章 操作系统提供什么":
    - "章节概览": chapter_01_foundations/index.md
    - "操作系统的角色、结构与启动": chapter_01_foundations/01_os_roles_architecture_boot.md
    - "内核态、系统调用、中断与异常": chapter_01_foundations/02_kernel_user_syscalls_interrupts.md
  - "第 2 章 进程、线程与进程间通信":
    - "章节概览": chapter_02_processes/index.md
    - "进程、线程与上下文切换": chapter_02_processes/01_process_thread_context.md
    - "生命周期、调度与进程间通信": chapter_02_processes/02_scheduling_ipc.md
  - "第 3 章 CPU 调度与资源竞争":
    - "调度实验：就绪、运行与等待": chapter_02_processes/03_cpu_scheduler_lab.md
  - "第 4 章 并发、同步与死锁":
    - "章节概览": chapter_03_concurrency/index.md
    - "竞态、原子性与锁": chapter_03_concurrency/01_races_atomicity_locks.md
    - "信号量与条件变量": chapter_03_concurrency/02_semaphores_condition_variables.md
    - "经典同步问题": chapter_03_concurrency/03_classic_synchronization.md
    - "死锁、检测与恢复": chapter_03_concurrency/04_deadlock.md
  - "第 5 章 虚拟内存与内存压力":
    - "章节概览": chapter_04_memory/index.md
    - "地址空间与分页": chapter_04_memory/01_address_space_paging.md
    - "页表、TLB 与缺页": chapter_04_memory/02_page_tables_tlb_faults.md
    - "页面置换与内存分配": chapter_04_memory/03_replacement_allocation.md
  - "第 6 章 文件、文件系统与设备 I/O":
    - "章节概览": chapter_05_storage_io/index.md
    - "文件、目录与 inode": chapter_05_storage_io/01_files_directories_inodes.md
    - "I/O 模型与设备驱动": chapter_05_storage_io/03_io_models_drivers.md
    - "中断、DMA 与缓存层次": chapter_05_storage_io/04_interrupts_dma_cache.md
    - "跟踪一次 read 系统调用": chapter_07_case_diagnostics/01_read_system_call_path.md
  - "第 7 章 持久化与崩溃恢复":
    - "崩溃一致性、日志与磁盘调度": chapter_05_storage_io/02_journaling_crash_disk.md
  - "第 8 章 权限、身份与安全边界":
