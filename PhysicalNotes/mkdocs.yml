site_name: Physical Notes
site_url: https://tensofermi.github.io/notes/PhysicalNotes/

theme:
  name: material
  language: 'zh'
  font: false
  logo: logo/physical_notes.svg
  favicon: logo/main.png
  palette:
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  features:
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

plugins:
  - search:
      lang:
        - zh
        - en
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: none
      width: 100%
      height: auto
      zoomable: true
      draggable: false
      auto_caption: false
      caption_position: bottom

hooks:
  - ../mkdocs_file_search.py

extra_javascript:
  - javascripts/mathjax.js
  - https://tensofermi.github.io/notes/_shared/mathjax/es5/tex-chtml.js

extra:
  social:
    - icon: octicons/home-fill-24
      link: https://tensofermi.github.io/

use_directory_urls: false

nav:
  - 概述: index.md
  - 普物知识总结:
    - 概览: general_physics/index.md
    - 力学总结: general_physics/mechanics.md
    - 电磁学总结: general_physics/electromagnetism.md
    - 热学总结: general_physics/thermal.md
    - 光学总结: general_physics/optics.md
    - 原子物理总结: general_physics/atomic_physics.md
  - 四大力学简述:
    - 概览: advanced_physics/index.md
    - 经典力学简述: advanced_physics/classical_mechanics.md
    - 电动力学简述: advanced_physics/electrodynamics.md
    - 热力学·统计物理简述-上: advanced_physics/thermo_stat_1.md
    - 热力学·统计物理简述-下: advanced_physics/thermo_stat_2.md
    - 量子力学简述？笔记！: advanced_physics/quantum_mechanics.md
  - 涨落迷雾:
    - 概览: fluctuations/index.md
    - 某暑假的数理小记: fluctuations/summer_math_physics.md
    - 机械波与电磁波在多普勒效应模式上的差异: fluctuations/doppler_wave.md
    - 基于Mathematica的复变函数可视化: fluctuations/complex_visualization.md
    - 常见三角公式的证明与理解by.LaTex: fluctuations/trig_latex.md
